server:
  port: 8080
cors:
  originPatterns: http://localhost:3000,http://localhost:8080,https://erudio.com.br
file:
  uploadDir: /rest-practice/uploadDir
security:
  jwt:
    token:
      secret-key: 53ccr37
      expire-length: 36000
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB		
springdoc:
  pathsToMatch: /api/**/v1/**
  swagger-ui:
    use-root-path: true