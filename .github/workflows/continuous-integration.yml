name: Continuous Integration

on:
  push:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3.3.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
              
    - name: Set up JDK 21    
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'adopt'
        cache: maven
        
    - name: Build Application JAR
      working-directory: ./16_ConfigureCORS/rest-with-spring-boot-and-java
      run: mvn clean package
      
    - name: Docker Compose Build
      working-directory: ./16_ConfigureCORS
      run: docker compose build      

    - name: Push to Docker Hub Container Registry
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/udemy-coursedb:latest ${{ secrets.DOCKER_USERNAME }}/udemy-coursedb:${{ github.run_id }}

        docker push ${{ secrets.DOCKER_USERNAME }}/udemy-coursedb:${{ github.run_id }}
        docker push ${{ secrets.DOCKER_USERNAME }}/udemy-coursedb:latest
      

